          - generic [ref=f10e291]:
            - heading "Why should you choose a dentist in Hungary?" [level=3] [ref=f10e293]
            - generic [ref=f10e295]:
              - paragraph [ref=f10e296]: Thanks to an international clientele that has visited our country for more than 20 years, private dental clinics in Hungary are equipped with the most modern technology and HD-Dental is one of them.
              - paragraph [ref=f10e297]: Hungarian dentists are trained in all areas of general dentistry. Their qualifications are recognized in the European Union and many of them work abroad.
            - heading "Is it really that cheap?" [level=3] [ref=f10e299]
            - generic [ref=f10e301]:
              - paragraph [ref=f10e302]: Hungary offers a wide range of dental clinics that are available to visitors at much lower prices than in the USA and UK.
              - paragraph [ref=f10e303]:
                - text: If you choose a
                - link "dental treatment in our clinic" [ref=f10e304] [cursor=pointer]:
                  - /url: https://hd-dental.net/en/treatments/
                - text: decide, you can really save a lot of money. The same treatment can cost up to 50% less with us than in the USA or UK. Due to favorable economic conditions in Hungary, we can offer our patients treatment of the highest quality and often at surprisingly low prices.
              - paragraph [ref=f10e305]: This is largely made possible by lower operating and labor costs, while we use materials from the same well-known brands used worldwide.
