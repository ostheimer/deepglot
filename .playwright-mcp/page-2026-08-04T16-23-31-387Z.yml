            - heading "Who are we?" [level=2] [ref=f10e79]
            - generic [ref=f10e80]:
              - paragraph [ref=f10e81]:
                - text: "A cheerful dental practice in Hungary, close to the Austrian border. Our profile:"
                - link "Dental treatments – affordable and fast" [ref=f10e82] [cursor=pointer]:
                  - /url: https://hd-dental.net/en/treatments/
                - text: .
              - paragraph [ref=f10e83]: The economic environment allows us to offer our services at significantly lower prices than in other countries. The large capacity of the practice makes waiting times unnecessary.
              - paragraph [ref=f10e84]: "We constantly strive to guarantee our patients a relaxed and calm atmosphere. We are unfamiliar with time pressure: as far as possible, we tailor our services to your individual needs."
          - generic [ref=f10e86]:
            - heading "Where are we?" [level=2] [ref=f10e88]
            - generic [ref=f10e89]:
              - paragraph [ref=f10e90]: The practice is located just beyond the Austrian–Hungarian border in Mosonmagyaróvár, 70 km southeast of Vienna. By plane we can be reached from anywhere in Europe within 2 hours.
              - paragraph [ref=f10e91]: Around the time of treatment we offer many services such as free airport transfer (and back), help finding and booking accommodation, and organizing your sight-seeing tours. As your dentist in Hungary, we are here for you.
              - paragraph [ref=f10e92]:
                - text: Where exactly are we?
                - link "Location map" [ref=f10e93] [cursor=pointer]:
                  - /url: https://goo.gl/maps/L3ZvBYjA14Cx8RU9A
                - text: How can you reach us?
                - link "Getting here" [ref=f10e94] [cursor=pointer]:
                  - /url: https://hd-dental.net/en/directions/
              - paragraph [ref=f10e95]: We are happy to advise you and provide all necessary information. If you have questions that you cannot find answers to here, please contact us.
