          - generic [ref=f5e75]:
            - heading "über uns" [level=2] [ref=f5e77]
            - heading "Wer sind wir?" [level=2] [ref=f5e79]
            - generic [ref=f5e80]:
              - paragraph [ref=f5e81]:
                - text: "Eine gut gelaunte Zahnarztpraxis in Ungarn, unweit der österreichischen Grenze. Unser Profil:"
                - link "Zahnbehandlungen – preisgünstig und schnell" [ref=f5e82] [cursor=pointer]:
                  - /url: https://hd-dental.net/en/treatments/
                - text: .
              - paragraph [ref=f5e83]: Die wirtschaftliche Umgebung erlaubt uns, unsere Leistungen zu wesentlich niedrigeren Preisen anzubieten als in anderen Ländern. Die große Kapazität der Praxis macht Wartezeiten überflüssig.
              - paragraph [ref=f5e84]: "Wir bemühen uns konstant, unseren Patienten eine entspannte und ruhige Atmosphäre zu garantieren. Termindruck ist uns unbekannt: Soweit möglich, richten wir uns individuell auf Ihre Bedürfnisse ein."
          - generic [ref=f5e86]:
            - heading "Wo sind wir?" [level=2] [ref=f5e88]
            - generic [ref=f5e89]:
              - paragraph [ref=f5e90]: Die Praxis befindet sich direkt hinter der österreichisch-ungarischen Grenze in Mosonmagyaróvár, 70 km südöstlich von Wien. Mit dem Flugzeug sind wir binnen 2 Stunden aus ganz Europa zu erreichen.
              - paragraph [ref=f5e91]: Im Umfeld der Behandlung bieten wir Ihnen viele Serviceleistungen wie kostenlosen Transfer vom Flughafen (und zurück), Hilfe bei der Zimmersuche und Buchung, bis zur Organisation Ihrer Sight-Seeing Touren. Wir sind als Ihr Zahnarzt in Ungarn für Sie da.
              - paragraph [ref=f5e92]:
                - text: Wo sind wir genau?
                - link "Lageplan" [ref=f5e93] [cursor=pointer]:
                  - /url: https://goo.gl/maps/L3ZvBYjA14Cx8RU9A
                - text: Wie erreichen Sie uns?
                - link "Anreise" [ref=f5e94] [cursor=pointer]:
                  - /url: https://hd-dental.net/en/directions/
              - paragraph [ref=f5e95]: Wir beraten Sie gerne und geben Ihnen alle notwendigen Informationen. Falls Sie Fragen haben, auf die Sie hier keine Antwort finden, nehmen Sie Kontakt mit uns auf.
