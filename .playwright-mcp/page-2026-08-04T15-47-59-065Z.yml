        - generic [ref=f5e279]:
          - generic [ref=f5e281]:
            - 'heading "Tauchen Sie in virtuelle Realität ein: Wenn Sie zurückkommen, sind Ihre Zähne fertig!" [level=3] [ref=f5e283]'
            - img "VR-Brille bei Ihrem Zahnarzt in Ungarn" [ref=f5e289]
          - generic [ref=f5e291]:
            - heading "Warum sollten Sie sich für einen Zahnarzt in Ungarn entscheiden?" [level=3] [ref=f5e293]
            - generic [ref=f5e295]:
              - paragraph [ref=f5e296]: Dank internationaler Klientel, die unser Land für mehr als 20 Jahre besucht, sind die privaten Zahnkliniken in Ungarn mit der modernsten Technologie ausgestattet und HD-Dental ist eine davon.
              - paragraph [ref=f5e297]: Ungarische Zahnärzte werden in allen Bereichen der allgemeinen Zahnmedizin ausgebildet. Ihre Qualifikation ist in der Europäischen Union anerkannt und viele von ihnen arbeiten im Ausland.
            - heading "Ist das wirklich so billig?" [level=3] [ref=f5e299]
            - generic [ref=f5e301]:
              - paragraph [ref=f5e302]: Ungarn bietet eine große Auswahl an Zahnkliniken, die ihren Besuchern zu einem viel günstigeren Preis zur Verfügung stehen als in USA und UK.
              - paragraph [ref=f5e303]:
                - text: Wenn Sie sich für eine
                - link "Zahnbehandlung in unserer Klinik" [ref=f5e304] [cursor=pointer]:
                  - /url: https://hd-dental.net/en/treatments/
                - text: entscheiden, können Sie wirklich eine ganze Menge Geld sparen. Dieselbe Behandlung kann bei uns um 50 % weniger kosten als in USA oder UK. Aufgrund der günstigen Wirtschaftbedingungen in Ungarn können wir unseren Patienten eine Behandlung von höchster Qualität und oft zu erstaunlich niedrigen Preisen anbieten.
              - paragraph [ref=f5e305]: Zum großen Teil ermöglichen uns das geringere Betriebs- und Lohnkosten, während wir Materialien der gleichen, gut bekannten Marken verwenden wie in der ganzen Welt.
