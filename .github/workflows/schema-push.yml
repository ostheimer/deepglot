name: Schema push (production)

# Applies prisma/schema.prisma to the database configured in Vercel's
# Production environment. Run it once with apply=false to see the SQL diff,
# then again with apply=true. Credentials are pulled from Vercel inside the
# runner and masked; nothing is printed.
#
# Always dispatch from main (the GitHub "Production" environment is restricted
# to main, so the workflow code cannot be swapped on a branch); the schema to
# apply comes from the `schema_ref` input instead.

on:
  workflow_dispatch:
    inputs:
      schema_ref:
        description: "Branch, tag or SHA whose prisma/schema.prisma is applied"
        type: string
        default: main
      apply:
        description: "Apply the schema (false = only print the SQL diff)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: schema-push-production
  cancel-in-progress: false

jobs:
  schema:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out schema source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.schema_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment from Vercel
        run: npx vercel@latest env pull .env.production.local --environment=production --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Export masked database URL
        run: |
          node -e '
            const { parse } = require("dotenv");
            const fs = require("node:fs");
            const env = parse(fs.readFileSync(".env.production.local"));
            // Same precedence as prisma.config.ts and src/lib/database-url.ts.
            const url = (env.DEEPGLOT_DATABASE_URL || "").trim() || env.DATABASE_URL;
            if (!url) { console.error("Neither DEEPGLOT_DATABASE_URL nor DATABASE_URL is set in the Vercel Production scope"); process.exit(1); }
            console.log(`::add-mask::${url}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `DEEPGLOT_DATABASE_URL=${url}\n`);
            console.log(`Database host: ${new URL(url).hostname}`);
          '
          rm -f .env.production.local

      - name: Plan (SQL diff, live database → schema.prisma)
        run: npx prisma migrate diff --from-url "$DEEPGLOT_DATABASE_URL" --to-schema prisma/schema.prisma --script

      - name: Apply schema
        if: ${{ inputs.apply }}
        run: npx prisma db push --skip-generate
