name: Schema push (production)

# Applies prisma/schema.prisma to the database configured in Vercel's
# Production environment. Run it once with apply=false to see the SQL diff,
# then again with apply=true. Credentials are pulled from Vercel inside the
# runner and masked; nothing is printed.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the schema (false = only print the SQL diff)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: schema-push-production
  cancel-in-progress: false

jobs:
  schema:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment from Vercel
        run: npx vercel@latest env pull .env.production.local --environment=production --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Export masked database URL
        run: |
          node -e '
            const { parse } = require("dotenv");
            const fs = require("node:fs");
            const env = parse(fs.readFileSync(".env.production.local"));
            const url = env.DATABASE_URL_UNPOOLED || env.DATABASE_URL;
            if (!url) { console.error("No DATABASE_URL in Vercel production env"); process.exit(1); }
            console.log(`::add-mask::${url}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${url}\n`);
            console.log(`Database host: ${new URL(url).hostname}`);
          '
          rm -f .env.production.local

      - name: Plan (SQL diff, live database → schema.prisma)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema prisma/schema.prisma --script

      - name: Apply schema
        if: ${{ inputs.apply }}
        run: npx prisma db push --skip-generate
