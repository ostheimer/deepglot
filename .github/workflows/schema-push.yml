name: Schema push (production)

# Applies a prisma/schema.prisma to the database configured in Vercel's
# Production environment. Run it once with apply=false to see the SQL diff;
# the plan prints the exact commit it used. Then run it again with
# schema_ref=<that commit> and apply=true. Credentials are pulled from Vercel
# inside the runner and masked; only the database hostname is printed.
#
# Always dispatch from main. The toolchain (package-lock, Prisma CLI,
# prisma.config.ts) is checked out from main; only the schema file is taken
# from schema_ref, so a branch cannot run code with the production credential.

on:
  workflow_dispatch:
    inputs:
      schema_ref:
        description: "Branch, tag or commit whose prisma/schema.prisma is used. apply=true requires a full 40-character commit SHA reported by a plan run."
        type: string
        default: main
      apply:
        description: "Apply the schema (false = only print the SQL diff)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: schema-push-production
  cancel-in-progress: false

jobs:
  schema:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SCHEMA_REF: ${{ inputs.schema_ref }}
      APPLY: ${{ inputs.apply }}
    steps:
      - name: Require an immutable commit for apply
        if: ${{ inputs.apply }}
        run: |
          if ! printf '%s' "$SCHEMA_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::apply=true needs schema_ref to be the 40-character commit SHA printed by a plan run, got '$SCHEMA_REF'."
            exit 1
          fi

      - name: Check out trusted toolchain (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Take prisma/schema.prisma from schema_ref
        run: |
          git fetch --no-tags --depth=1 origin "$SCHEMA_REF"
          resolved="$(git rev-parse FETCH_HEAD)"
          git show "FETCH_HEAD:prisma/schema.prisma" > prisma/schema.prisma
          echo "Schema taken from commit $resolved (schema_ref=$SCHEMA_REF)"
          echo "::notice title=Schema commit::$resolved"
          git --no-pager diff --stat -- prisma/schema.prisma

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment from Vercel
        run: npx vercel@latest env pull .env.production.local --environment=production --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Export masked database URL
        run: |
          node -e '
            const { parse } = require("dotenv");
            const fs = require("node:fs");
            const env = parse(fs.readFileSync(".env.production.local"));
            // Same precedence as prisma.config.ts and src/lib/database-url.ts.
            const url = (env.DEEPGLOT_DATABASE_URL || "").trim() || env.DATABASE_URL;
            if (!url) { console.error("Neither DEEPGLOT_DATABASE_URL nor DATABASE_URL is set in the Vercel Production scope"); process.exit(1); }
            console.log(`::add-mask::${url}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `DEEPGLOT_DATABASE_URL=${url}\n`);
            console.log(`Database host: ${new URL(url).hostname}`);
          '
          rm -f .env.production.local

      - name: Plan (SQL diff, live database → schema.prisma)
        run: npx prisma migrate diff --from-url "$DEEPGLOT_DATABASE_URL" --to-schema prisma/schema.prisma --script

      - name: Apply schema
        if: ${{ inputs.apply }}
        run: npx prisma db push
