name: Schema push (production)

# Applies main's prisma/schema.prisma to the database configured in Vercel's
# Production environment. Only merged, reviewed schema is ever applied.
#
#   1. Dispatch with apply=false: computes the SQL plan (schema-plan.sql) with
#      `prisma migrate diff`, prints it, and warns if it contains destructive
#      statements. Nothing is executed against the database.
#   2. Dispatch with apply=true and schema_sha=<the commit the plan run used>:
#      recomputes the same plan and, if it is not destructive, executes that
#      exact schema-plan.sql with `prisma db execute`. A destructive plan
#      (DROP/TRUNCATE/DELETE/ALTER COLUMN ... TYPE) fails the run instead of
#      being applied — review it manually and run it by hand if intended.
#
# `prisma db push` is not used: it would infer and run its own diff against
# the live database rather than the exact, reviewed schema-plan.sql.
#
# The production URL is read through the Vercel REST API with Node's built-in
# fetch (no third-party CLI sees the token), masked, and only its hostname is
# printed. Prisma runs from the locked toolchain in package-lock.json.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the schema (false = only print the SQL diff)"
        type: boolean
        default: false
      schema_sha:
        description: "For apply=true: the 40-character main commit printed by the plan run. The run fails if main has moved since."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: schema-push-production
  cancel-in-progress: false

jobs:
  schema:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      APPLY: ${{ inputs.apply }}
      SCHEMA_SHA: ${{ inputs.schema_sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve schema commit
        run: |
          head="$(git rev-parse HEAD)"
          echo "Schema: prisma/schema.prisma at main commit $head"
          echo "::notice title=Schema commit::$head"
          if [ "$APPLY" = "true" ] && [ "$SCHEMA_SHA" != "$head" ]; then
            echo "::error::apply=true needs schema_sha=$head (the commit printed by the plan run); got '$SCHEMA_SHA'. Re-run the plan if main has moved."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read production database URL from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node -e '
            const fs = require("node:fs");
            const { VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID } = process.env;
            const authHeaders = { Authorization: `Bearer ${VERCEL_TOKEN}` };

            // Vercel error bodies carry only a code and message, never values.
            const vercelError = async (res, context) => {
              const body = await res.text().catch(() => "");
              return new Error(`Vercel API ${res.status} for ${context} (team ${VERCEL_ORG_ID}): ${body.slice(0, 500)}`);
            };

            (async () => {
              // The list endpoint never honours decrypt=true; it only tells us which
              // variable to read and its id/type. See run 35339991961.
              const listUrl = `https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}`;
              const listRes = await fetch(listUrl, { headers: authHeaders });
              if (!listRes.ok) throw await vercelError(listRes, "project env list");
              const { envs } = await listRes.json();
              const pick = (key) => envs.find((e) => e.key === key && e.target.includes("production"));
              // Same precedence as prisma.config.ts and src/lib/database-url.ts.
              const entry = pick("DEEPGLOT_DATABASE_URL") || pick("DATABASE_URL");
              if (!entry) throw new Error("Neither DEEPGLOT_DATABASE_URL nor DATABASE_URL is present in the Vercel Production scope");

              if (entry.type === "sensitive") {
                throw new Error(`${entry.key} is a Vercel "sensitive" environment variable; its value cannot be read back via the API. Provide it another way (e.g. a GitHub Actions secret).`);
              }

              const singleUrl = `https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/env/${entry.id}?teamId=${VERCEL_ORG_ID}`;
              const singleRes = await fetch(singleUrl, { headers: authHeaders });
              if (!singleRes.ok) throw await vercelError(singleRes, "single project env read");
              const { value } = await singleRes.json();
              if (typeof value !== "string" || !value.trim()) {
                throw new Error(`${entry.key} did not come back with a decrypted value from Vercel (type: ${entry.type})`);
              }
              const trimmed = value.trim();

              // Mask before any parsing so a malformed value never reaches the log unmasked.
              console.log(`::add-mask::${trimmed}`);

              let hostname;
              try {
                if (!/^postgres(?:ql)?:\/\//.test(trimmed)) throw new Error("not a postgres URL");
                hostname = new URL(trimmed).hostname;
              } catch {
                throw new Error(`${entry.key} from Vercel is not a valid postgres:// connection string`);
              }

              fs.appendFileSync(process.env.GITHUB_ENV, `DEEPGLOT_DATABASE_URL=${trimmed}\n`);
              console.log(`Using ${entry.key} (${entry.type}); database host: ${hostname}`);
            })().catch((error) => { console.error(error.message); process.exit(1); });
          '

      - name: Plan (SQL diff, live database → schema.prisma)
        id: plan
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script \
            -o schema-plan.sql

          echo "----- schema-plan.sql -----"
          cat schema-plan.sql
          echo "----------------------------"

          node -e '
            const fs = require("node:fs");
            const sql = fs.readFileSync("schema-plan.sql", "utf8");

            // A real diff always has at least one non-comment, non-blank
            // line; an empty diff is rendered as a single comment line.
            const meaningful = sql
              .split("\n")
              .filter((line) => !/^\s*--/.test(line) && line.trim() !== "");
            const empty = meaningful.length === 0;

            console.log(empty
              ? "schema-plan.sql is EMPTY: no schema changes to apply."
              : "schema-plan.sql is NOT empty: schema changes are pending.");

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `plan_empty=${empty}\n`);
          '

      - name: Guard against destructive SQL
        run: |
          node -e '
            const fs = require("node:fs");
            const planFile = "schema-plan.sql";
            const apply = process.env.APPLY === "true";
            const raw = fs.readFileSync(planFile, "utf8");

            // Drop full-line SQL comments before splitting into statements so
            // a comment that merely mentions DROP/TRUNCATE/etc never trips
            // the guard (e.g. "-- replaces the dropped legacy column").
            const withoutComments = raw
              .split("\n")
              .filter((line) => !/^\s*--/.test(line))
              .join("\n");

            const statements = withoutComments
              .split(";")
              .map((s) => s.trim())
              .filter(Boolean);

            // DROP (TABLE/COLUMN/INDEX/CONSTRAINT/TYPE/...), TRUNCATE, DELETE,
            // and a column type change (ALTER COLUMN ... TYPE) can all lose
            // data; everything else `migrate diff` emits (CREATE, ADD COLUMN,
            // ADD CONSTRAINT, ...) is additive and passes through.
            const destructiveRe = /\b(DROP|TRUNCATE|DELETE)\b|ALTER\s+COLUMN\b[\s\S]*?\bTYPE\b/i;
            const destructive = statements.filter((s) => destructiveRe.test(s));

            if (destructive.length === 0) {
              console.log(`No destructive statements detected in ${planFile}.`);
              process.exit(0);
            }

            console.log(`${apply ? "::error::" : "::warning::"}Destructive statement(s) detected in ${planFile}:`);
            for (const s of destructive) console.log(`  ${s};`);

            if (apply) {
              console.error("::error::Refusing to apply destructive SQL with apply=true. Review schema-plan.sql manually, then run the statements by hand if they are intended.");
              process.exit(1);
            }

            console.log("::warning::apply=false, so this run continues as a plan only; re-check schema-plan.sql before dispatching with apply=true.");
          '

      - name: Apply schema
        if: ${{ inputs.apply }}
        run: |
          if [ "${{ steps.plan.outputs.plan_empty }}" = "true" ]; then
            echo "nothing to apply"
            exit 0
          fi
          npx prisma db execute --file schema-plan.sql
